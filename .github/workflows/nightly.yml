name: Nightly watch list

# Runs without a person. 05:30 Atlantic, so the brief is waiting before the shift.
on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the list
        run: python3 src/hotspots.py

      - name: Commit the result
        run: |
          git config user.name "watchlist-bot"
          git config user.email "watchlist-bot@users.noreply.github.com"
          git add out/
          git diff --staged --quiet || git commit -m "watch list: $(date -u +%Y-%m-%d)"
          git push
